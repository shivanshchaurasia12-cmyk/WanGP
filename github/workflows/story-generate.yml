name: Story Generate Test

on:
  workflow_dispatch:

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Generate story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot/story_generator.py

      - name: Show story
        run: cat story.json

      - uses: actions/upload-artifact@v4
        with:
          name: story
          path: story.json
